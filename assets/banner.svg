<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Wisnu Jaya — ML, data science and the math behind them">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1a"/><stop offset="0.55" stop-color="#11143a"/><stop offset="1" stop-color="#241047"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.5" stop-color="#a5b4fc"/><stop offset="1" stop-color="#f0abfc"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
  <radialGradient id="neb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
</defs>
<style>
  .s { fill:#e0e7ff; animation-name:tw; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  @keyframes tw { 0%,100% {opacity:.25} 50% {opacity:1} }
  .hi   { font:500 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#93c5fd; }
  .name { font:800 68px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:url(#ink); letter-spacing:-1px; }
  .sub  { font:400 21px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#cbd5e1; }
  .eq   { font:italic 400 19px "Times New Roman",Georgia,serif; fill:#c4b5fd; }
  .rail { stroke:#475569; stroke-width:2; }
  .tick { stroke:#334155; stroke-width:1.5; }
  .node { fill:#0f172a; stroke:#a5b4fc; stroke-width:1.5; }
  .rname{ font:600 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#e2e8f0; }
  .rlab { font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#94a3b8; }
  .cap  { font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#64748b; letter-spacing:2px; }
  .climb{ animation: climb 7s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes climb { 0% {transform:translateY(0)} 80%,100% {transform:translateY(-240px)} }
  .rise { opacity:0; animation: rise .9s ease-out forwards; }
  .d1 {animation-delay:.1s} .d2 {animation-delay:.45s} .d3 {animation-delay:.8s} .d4 {animation-delay:1.15s}
  @keyframes rise { from {opacity:0; transform:translateY(12px)} to {opacity:1; transform:translateY(0)} }
  .cursor { animation: blink 1.1s steps(1) infinite; fill:#93c5fd; }
  @keyframes blink { 50% {opacity:0} }
  @media (prefers-reduced-motion: reduce) { .s,.climb,.cursor {animation:none} .rise {animation:none; opacity:1} }
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <ellipse cx="930" cy="150" rx="330" ry="210" fill="url(#neb)"/>
