y="325.2" r="1.3" style="animation-delay:3.23s;animation-duration:4.31s"/><circle class="s" cx="419.4" cy="331.3" r="0.6" style="animation-delay:0.88s;animation-duration:3.07s"/><circle class="s" cx="1182.3" cy="207.5" r="0.6" style="animation-delay:1.92s;animation-duration:4.13s"/><circle class="s" cx="959.6" cy="28.8" r="0.6" style="animation-delay:3.64s;animation-duration:4.46s"/><circle class="s" cx="961.0" cy="330.4" r="1.3" style="animation-delay:1.85s;animation-duration:4.36s"/><circle class="s" cx="101.9" cy="54.0" r="0.8" style="animation-delay:0.11s;animation-duration:3.98s"/><circle class="s" cx="991.8" cy="333.3" r="1.0" style="animation-delay:0.62s;animation-duration:3.87s"/><circle class="s" cx="25.7" cy="271.8" r="0.6" style="animation-delay:2.11s;animation-duration:4.83s"/><circle class="s" cx="520.6" cy="296.4" r="0.8" style="animation-delay:0.11s;animation-duration:3.03s"/>
  <g class="rise d1"><text x="64" y="92" class="hi">$ whoami</text><rect x="168" y="76" width="11" height="20" class="cursor"/></g>
  <g class="rise d2"><text x="60" y="168" class="name">Wisnu Jaya</text></g>
  <g class="rise d3"><text x="64" y="212" class="sub">Machine learning · data science · the math underneath</text></g>
  <g class="rise d4"><text x="64" y="268" class="eq">θ* = arg min  (1/n) Σ ( yᵢ − f(xᵢ; θ) )²</text></g>
  <text x="785" y="28" class="cap">THE COSMIC LADDER</text>
